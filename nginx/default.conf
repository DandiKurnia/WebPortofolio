server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 100M;

    # -----------------------------
    # Cache super panjang untuk Vite build (hashed)
    # -----------------------------
    location ^~ /build/ {
        access_log off;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # -----------------------------
    # Cache super panjang untuk certificate images
    # (aman kalau nama file unik/uuid)
    # -----------------------------
    location ^~ /storage/certificate_images/ {
        access_log off;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # -----------------------------
    # Cache untuk static files lainnya (ikon, gambar umum, fonts, dll)
    # -----------------------------
    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|ttf|otf|woff|woff2)$ {
        access_log off;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # -----------------------------
    # HTML / route jangan cache lama
    # -----------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # -----------------------------
    # PHP
    # -----------------------------
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_index index.php;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
    }
}
